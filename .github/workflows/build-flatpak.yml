name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ruff check
        run: pipx run ruff check src tests tools
      - name: Check AGENTS.md §2 invariant 1 (src/*.py registered in src/meson.build)
        shell: bash
        run: |
          diff <(ls src/*.py | xargs -n1 basename | sort) \
               <(grep -o "'[a-z_]*\.py'" src/meson.build | tr -d "'" | sort)
      - name: Check AGENTS.md §2 invariant 2 (no private python-mpv API, awaiting C6)
        continue-on-error: true
        run: '! grep -rn "_get_property\|self\.mpv\._\|player\._" src/'
      - name: Check AGENTS.md §2 invariant 3 (no validation in product build/imports, awaiting C4)
        continue-on-error: true
        run: '! grep -n "gpu_validation\|DiagnosticsExporter" src/meson.build src/*.py'

  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CineHDR.flatpak
          manifest-path: build-aux/flatpak/io.github.rusmikev.CineHDR.json
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/**', '.gitmodules') }}
          run-tests: true
          arch: x86_64
